<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title> 💗 गोल्ड जिम · प्रीमियम 3D हिसाब </title>
    <style>
        /* ========== 3D स्टाइल - और सुंदर ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0f172a, #030614);
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===== 3D ग्लास मॉर्फिज्म कार्ड ===== */
        .glass-card {
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 48px;
            padding: 28px 24px;
            box-shadow: 0 25px 40px -15px #00000099, 0 0 0 1px rgba(0, 255, 255, 0.1) inset, 0 0 30px rgba(0, 150, 255, 0.2);
        }

        /* ===== हैडर ===== */
        .gym-header {
            background: linear-gradient(135deg, #0b1a33, #071126);
            border: 2px solid #00ffff;
            border-radius: 50px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 30px -10px cyan;
        }
        .gym-name {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(145deg, #fff, #aaffff, #6ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px cyan;
            letter-spacing: 2px;
        }
        .gym-owner {
            font-size: 28px;
            color: #ffd966;
            margin-top: 8px;
            text-shadow: 0 0 10px orange;
        }

        /* ===== व्हाट्सएप बटन ===== */
        .whatsapp-block {
            background: linear-gradient(145deg, #25D366, #128C7E);
            border-radius: 100px;
            padding: 20px;
            border-bottom: 6px solid #0b5e4e;
            box-shadow: 0 20px 30px #25D36666;
            transition: 0.1s ease;
        }
        .whatsapp-block a {
            color: white;
            text-decoration: none;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .whatsapp-block span {
            background: white;
            color: #128C7E;
            padding: 8px 28px;
            border-radius: 60px;
            font-size: 28px;
        }

        /* ===== महीने के टैब ===== */
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0 10px;
        }
        .month-btn {
            background: #13203b;
            padding: 16px 30px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #3b68b0;
            transition: 0.1s;
            color: #b0d0ff;
            box-shadow: 0 5px 0 #0b1423;
        }
        .month-btn.active {
            background: cyan;
            color: black;
            border-color: white;
            box-shadow: 0 0 20px cyan;
            transform: scale(1.02);
        }
        .month-btn.new {
            background: gold;
            color: black;
            border-color: orange;
        }

        /* ===== स्टैट्स कार्ड ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: #152a44;
            border-radius: 40px;
            padding: 25px 15px;
            text-align: center;
            border-left: 6px solid cyan;
            border-bottom: 4px solid #0d3250;
        }
        .stat-number {
            font-size: 46px;
            font-weight: 800;
            color: cyan;
        }

        /* ===== सदस्य कार्ड (तारीख के साथ) ===== */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .member-card {
            background: #10213be0;
            border-radius: 40px;
            padding: 28px 22px;
            border: 1.5px solid #3f78c0;
            box-shadow: 0 10px 0 #09131f;
            transition: 0.1s;
        }
        .member-card:hover {
            border-color: cyan;
            box-shadow: 0 0 25px cyan;
        }
        .member-name {
            font-size: 32px;
            font-weight: 700;
            color: #b5ffff;
            margin-bottom: 12px;
        }
        .member-row {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            padding: 12px 0;
            border-bottom: 1px dashed #3761a0;
        }
        .badge-paid {
            color: #a0ffb0;
            font-weight: 700;
        }
        .badge-due {
            color: #ffaa66;
            font-weight: 700;
        }
        .member-date {
            font-size: 18px;
            color: #aaccff;
            background: #1c3155;
            display: inline-block;
            padding: 8px 22px;
            border-radius: 40px;
            margin-top: 15px;
        }

        /* ===== डिलीट बटन ===== */
        .delete-btn {
            background: #bc3f3f;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            border-bottom: 4px solid #6b1f1f;
        }
        .delete-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* ===== मालिक पैनल (सोने का) ===== */
        .owner-panel {
            background: #1f2937;
            border: 4px solid gold;
            border-radius: 60px;
            padding: 35px;
            box-shadow: 0 20px 30px #ffd70033;
        }
        .owner-title {
            color: gold;
            font-size: 40px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .owner-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .owner-input {
            background: #0b1a32;
            border: 2px solid cyan;
            border-radius: 60px;
            padding: 18px 22px;
            color: white;
            font-size: 18px;
        }
        .owner-input:focus {
            border-color: gold;
            box-shadow: 0 0 15px gold;
        }
        .owner-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 60px;
            padding: 18px 28px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 4px solid #b8860b;
        }
        .owner-toggle {
            background: gold;
            color: black;
            padding: 18px;
            border-radius: 60px;
            font-size: 26px;
            font-weight: bold;
            width: 100%;
            border: none;
            margin: 20px 0;
            cursor: pointer;
            border-bottom: 4px solid #b8860b;
        }

        .footer {
            text-align: center;
            color: #6a8bbf;
            padding: 30px;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 👑 मालिक बटन -->
    <button class="owner-toggle" onclick="toggleOwnerPanel()">🔐 मालिक पैनल खोलें (सिर्फ आपके लिए)</button>

    <!-- 🔒 मालिक पैनल -->
    <div class="owner-panel" id="ownerPanel" style="display: none;">
        <div class="owner-title">⚙️ मालिक पैनल</div>

        <!-- जिम की जानकारी -->
        <h3 style="color:cyan; margin:20px 0 15px;">🏢 जिम की जानकारी</h3>
        <div class="owner-form">
            <input class="owner-input" id="gymNameInput" placeholder="जिम का नाम" value="गोल्ड जिम">
            <input class="owner-input" id="ownerNameInput" placeholder="मालिक का नाम" value="राजेश कुमार">
            <button class="owner-btn" onclick="updateGymInfo()">✅ अपडेट</button>
        </div>

        <!-- नया सदस्य + तारीख -->
        <h3 style="color:cyan; margin:30px 0 15px;">➕ नया सदस्य (इस महीने) — तारीख के साथ</h3>
        <div class="owner-form">
            <input class="owner-input" id="memberName" placeholder="नाम (जैसे: राहुल)">
            <input class="owner-input" type="number" id="memberAmount" placeholder="राशी (₹)">
            <input class="owner-input" type="date" id="memberDate" value="2026-02-15">
            <select class="owner-input" id="memberStatus">
                <option value="पेड">✅ पेड</option>
                <option value="बकाया">⏳ बकाया</option>
            </select>
            <button class="owner-btn" onclick="addMember()">➕ जोड़ें</button>
        </div>
        <p style="color:#aaccff; margin-top:15px;">📅 तारीख डालना मत भूलना — जब पैसा दिया/बकाया है</p>
    </div>

    <!-- जिम हैडर -->
    <div class="gym-header">
        <div class="gym-name" id="gymNameDisplay">💪 गोल्ड जिम</div>
        <div class="gym-owner" id="ownerNameDisplay">राजेश कुमार (मालिक)</div>
    </div>

    <!-- व्हाट्सएप बटन (तुम्हारा नंबर) -->
    <div class="whatsapp-block">
        <a href="https://wa.me/919559401761" target="_blank">
            💬 <span>व्हाट्सएप</span> पर बात करें - 9559401761
        </a>
    </div>

    <!-- महीने के टैब -->
    <div class="month-tabs" id="monthTabs"></div>

    <!-- स्टैट्स -->
    <div class="stats-grid" id="monthStats"></div>

    <!-- सदस्य लिस्ट -->
    <h2 style="margin: 40px 0 10px; font-size: 36px; border-left: 10px solid cyan; padding-left: 25px;">📋 इस महीने के सदस्य (तारीख के साथ)</h2>
    <div class="members-grid" id="membersList"></div>

    <div class="footer">💗 3D GYM PRO · तारीख के साथ हिसाब · हर महीने अलग</div>
</div>

<script>
    // ========== डेटा स्ट्रक्चर (अब तारीख के साथ) ==========
    let gymData = {
        gymName: "गोल्ड जिम",
        ownerName: "राजेश कुमार",
        waNumber: "919559401761",
        months: {
            "जनवरी 2026": [
                { id: 1, name: "सचिन", amount: 2000, status: "पेड", date: "2026-01-15" },
                { id: 2, name: "अमित", amount: 2500, status: "बकाया", date: "2026-01-10" }
            ],
            "फरवरी 2026": [
                { id: 3, name: "विकास", amount: 3000, status: "पेड", date: "2026-02-05" }
            ]
        }
    };

    let currentMonth = "जनवरी 2026";

    // लोकल स्टोरेज से लोड
    function loadData() {
        let saved = localStorage.getItem('gymProMonthsV2');
        if (saved) {
            gymData = JSON.parse(saved);
        }
    }
    loadData();

    function saveData() {
        localStorage.setItem('gymProMonthsV2', JSON.stringify(gymData));
    }

    // ========== सब रेंडर ==========
    function renderAll() {
        // जिम जानकारी
        document.getElementById('gymNameDisplay').innerText = '💪 ' + gymData.gymName;
        document.getElementById('ownerNameDisplay').innerText = gymData.ownerName + ' (मालिक)';

        // महीने के टैब
        let months = Object.keys(gymData.months);
        let tabsHtml = '';
        months.forEach(m => {
            tabsHtml += `<div class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${m}</div>`;
        });
        tabsHtml += `<div class="month-btn new" onclick="addNewMonth()">➕ नया महीना</div>`;
        document.getElementById('monthTabs').innerHTML = tabsHtml;

        // करेंट महीने के सदस्य
        let members = gymData.months[currentMonth] || [];

        // स्टैट्स
        let totalMembers = members.length;
        let totalPaid = 0, totalDue = 0;
        members.forEach(m => {
            if (m.status === 'पेड') totalPaid += m.amount;
            else totalDue += m.amount;
        });
        document.getElementById('monthStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${totalMembers}</div><div>कुल सदस्य</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalPaid}</div><div>कुल जमा</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalDue}</div><div>कुल बकाया</div></div>
        `;

        // सदस्य लिस्ट (तारीख समेत)
        let membersHtml = '';
        members.forEach(m => {
            let dateStr = m.date ? m.date.split('-').reverse().join('-') : 'तारीख नहीं'; // dd-mm-yyyy
            membersHtml += `
            <div class="member-card">
                <div class="member-name">${m.name}</div>
                <div class="member-row"><span>💰 राशी</span> <strong>₹${m.amount}</strong></div>
                <div class="member-row"><span>📌 स्थिति</span> 
                    <strong class="${m.status === 'पेड' ? 'badge-paid' : 'badge-due'}">${m.status}</strong>
                </div>
                <div class="member-date">📅 तारीख: ${dateStr}</div>
                <button class="delete-btn" onclick="deleteMember(${m.id})" id="delete_${m.id}">🗑️ नाम काटें (हटाएँ)</button>
            </div>
            `;
        });
        document.getElementById('membersList').innerHTML = membersHtml;

        // डिलीट बटन छुपाना/दिखाना (मालिक पैनल के हिसाब से)
        let ownerVisible = document.getElementById('ownerPanel').style.display === 'block';
        document.querySelectorAll('[id^="delete_"]').forEach(btn => {
            btn.style.display = ownerVisible ? 'block' : 'none';
        });
    }

    // महीना बदलो
    window.switchMonth = function(month) {
        currentMonth = month;
        renderAll();
    };

    // नया महीना जोड़ो
    window.addNewMonth = function() {
        let newMonth = prompt("नया महीना का नाम लिखो (जैसे: मार्च 2026):");
        if (newMonth && !gymData.months[newMonth]) {
            gymData.months[newMonth] = [];
            saveData();
            currentMonth = newMonth;
            renderAll();
        }
    };

    // मालिक पैनल टॉगल
    window.toggleOwnerPanel = function() {
        let panel = document.getElementById('ownerPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        renderAll();
    };

    // जिम जानकारी अपडेट
    window.updateGymInfo = function() {
        gymData.gymName = document.getElementById('gymNameInput').value || gymData.gymName;
        gymData.ownerName = document.getElementById('ownerNameInput').value || gymData.ownerName;
        saveData();
        renderAll();
        alert('✅ जिम की जानकारी अपडेट हो गई');
    };

    // नया सदस्य (तारीख के साथ)
    window.addMember = function() {
        let name = document.getElementById('memberName').value;
        let amount = parseFloat(document.getElementById('memberAmount').value);
        let date = document.getElementById('memberDate').value;
        let status = document.getElementById('memberStatus').value;

        if (!name || !amount) {
            alert('❌ नाम और राशी दोनों भरो');
            return;
        }
        if (!date) {
            alert('❌ तारीख भी चुनो — कब पैसा दिया / बकाया है');
            return;
        }

        let newId = Date.now();
        if (!gymData.months[currentMonth]) {
            gymData.months[currentMonth] = [];
        }
        gymData.months[currentMonth].push({
            id: newId,
            name: name,
            amount: amount,
            status: status,
            date: date
        });

        saveData();
        renderAll();

        // फॉर्म साफ
        document.getElementById('memberName').value = '';
        document.getElementById('memberAmount').value = '';
        // तारीख आज की रहने दो
    };

    // सदस्य हटाओ
    window.deleteMember = function(id) {
        if (confirm('क्या सच में इस सदस्य को हटा दें?')) {
            gymData.months[currentMonth] = gymData.months[currentMonth].filter(m => m.id !== id);
            saveData();
            renderAll();
        }
    };

    // शुरू
    renderAll();
</script>
</body>
                </html>
