<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>3D GYM PRO · क्लाइंट पोर्टल</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #141b2b 100%);
            color: #eef3fc;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        /* Header */
        .header {
            background: rgba(10, 20, 40, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #00ccff55;
            border-radius: 30px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #aaffff, #6ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .whatsapp-btn {
            background: #25D366;
            padding: 12px 28px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            border-bottom: 4px solid #128C7E;
        }
        /* Cards */
        .card {
            background: #0e1629dd;
            backdrop-filter: blur(6px);
            border: 1px solid #2e4a7a;
            border-radius: 32px;
            padding: 24px;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .input-group {
            flex: 1 1 200px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #aaccff;
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #1e2a3a;
            border: 1.5px solid #3a5f8a;
            border-radius: 40px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
        }
        .btn {
            background: linear-gradient(145deg, #00b4ff, #0055ff);
            border: none;
            border-radius: 40px;
            padding: 14px 30px;
            font-weight: 700;
            color: white;
            border-bottom: 4px solid #003d99;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        /* Client cards grid */
        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .client-card {
            background: #1a243b;
            border-radius: 24px;
            padding: 20px;
            border-left: 6px solid cyan;
        }
        .client-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .client-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #3b5688;
        }
        .badge {
            background: #2f4b6e;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
        }
        .pending { color: #ffaa66; }
        .paid { color: #a0ffb0; }
        .whatsapp-mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #25D36633;
            padding: 8px 16px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            margin-top: 12px;
            border: 1px solid #25D366;
        }
        .footer {
            text-align: center;
            color: #7f93b3;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER with WHATSAPP NUMBER -->
    <div class="header">
        <div class="logo">
            <h1>🏋️ 3D GYM PRO</h1>
            <div style="font-size: 1rem;">क्लाइंट पोर्टल</div>
        </div>
        <a href="https://wa.me/919559401761?text=नमस्ते!%20मुझे%203D%20GYM%20PRO%20के%20बारे%20में%20जानकारी%20चाहिए।" class="whatsapp-btn" target="_blank">
            💬 98765 43210 (बिज़नेस से जुड़ें)
        </a>
    </div>

    <!-- ➕ CLIENT ADD FORM (AB SAHI KAM KAREGA) -->
    <div class="card">
        <h2 style="margin-bottom: 15px;">➕ नया क्लाइंट जोड़ें</h2>
        <div class="flex-row">
            <div class="input-group">
                <label>क्लाइंट का नाम</label>
                <input type="text" id="clientName" placeholder="जैसे: अनिल जिम">
            </div>
            <div class="input-group">
                <label>कुल सदस्य</label>
                <input type="number" id="clientMembers" value="1" min="1">
            </div>
            <div class="input-group">
                <label>कुल जमा (₹)</label>
                <input type="number" id="clientPaid" placeholder="जमा राशि">
            </div>
            <div class="input-group">
                <label>बकाया (₹)</label>
                <input type="number" id="clientDue" placeholder="बाकी राशि">
            </div>
            <button class="btn" id="addClientBtn">✅ क्लाइंट जोड़ें</button>
        </div>
        <p style="color: #aac8ff; margin-top: 15px;">📱 डेटा आपके फोन/लैपटॉप में सेव रहेगा</p>
    </div>

    <!-- 📊 TOTALS (पैसा जमा, लोग, बकाया) -->
    <div class="card" style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px;">
        <div style="text-align: center;">
            <div style="font-size: 0.9rem;">👥 कुल सदस्य</div>
            <div style="font-size: 2.5rem; font-weight: 700; color: #6ec8ff;" id="totalMembers">0</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 0.9rem;">💰 कुल जमा</div>
            <div style="font-size: 2.5rem; font-weight: 700; color: #a0ffb0;" id="totalPaid">₹0</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 0.9rem;">⏳ कुल बकाया</div>
            <div style="font-size: 2.5rem; font-weight: 700; color: #ffaa66;" id="totalDue">₹0</div>
        </div>
    </div>

    <!-- 🧑 CLIENT CARDS (हर क्लाइंट का अपना डेटा) -->
    <div class="card">
        <h2 style="margin-bottom: 20px;">📋 आपके क्लाइंट</h2>
        <div id="clientList" class="client-grid">
            <!-- JS se client cards fill honge -->
        </div>
        <p id="emptyMsg" style="text-align: center; padding: 40px; color: #8899cc;">✨ अभी कोई क्लाइंट नहीं। ऊपर से जोड़िए।</p>
    </div>

    <div class="footer">
        3D GYM PRO · स्मार्ट बिज़नेस सॉल्यूशन · 24/7 सपोर्ट
    </div>
</div>

<script>
    (function() {
        // Load clients from localStorage
        let clients = JSON.parse(localStorage.getItem('gymProClientsV2')) || [];

        // Demo data if empty
        if (clients.length === 0) {
            clients = [
                { id: Date.now()+1, name: "अनिल जिम", members: 45, paid: 25000, due: 5000 },
                { id: Date.now()+2, name: "सूर्य फिटनेस", members: 28, paid: 12000, due: 8000 },
                { id: Date.now()+3, name: "रोहित सर", members: 60, paid: 42000, due: 3000 }
            ];
            saveClients();
        }

        function saveClients() {
            localStorage.setItem('gymProClientsV2', JSON.stringify(clients));
            renderClients();
            updateTotals();
        }

        function renderClients() {
            const container = document.getElementById('clientList');
            const emptyMsg = document.getElementById('emptyMsg');
            if (!container) return;

            if (clients.length === 0) {
                container.innerHTML = '';
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            let html = '';
            clients.forEach(c => {
                html += `
                <div class="client-card">
                    <div class="client-name">${escapeHTML(c.name)}</div>
                    <div class="client-detail"><span>👥 सदस्य:</span> <strong>${c.members}</strong></div>
                    <div class="client-detail"><span>💰 जमा:</span> <strong class="paid">₹${c.paid}</strong></div>
                    <div class="client-detail"><span>⏳ बकाया:</span> <strong class="pending">₹${c.due}</strong></div>
                    <a href="https://wa.me/919876543210?text=नमस्ते%20${encodeURIComponent(c.name)}!%20मुझे%20अपने%20gym%20के%20लिए%203D%20GYM%20PRO%20लेना%20है।" target="_blank" class="whatsapp-mini">
                        💬 बिज़नेस से बात करें
                    </a>
                    <button class="btn" style="margin-top: 10px; width:100%; background:#3f3f6f;" onclick="deleteClient(${c.id})">🗑️ हटाएँ</button>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        window.deleteClient = function(id) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
        };

        function updateTotals() {
            let totalMembers = 0, totalPaid = 0, totalDue = 0;
            clients.forEach(c => {
                totalMembers += Number(c.members) || 0;
                totalPaid += Number(c.paid) || 0;
                totalDue += Number(c.due) || 0;
            });
            document.getElementById('totalMembers').innerText = totalMembers;
            document.getElementById('totalPaid').innerText = '₹' + totalPaid.toLocaleString('hi-IN');
            document.getElementById('totalDue').innerText = '₹' + totalDue.toLocaleString('hi-IN');
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"]/g, function(c) {
                if(c === '&') return '&amp;';
                if(c === '<') return '&lt;';
                if(c === '>') return '&gt;';
                if(c === '"') return '&quot;';
                return c;
            });
        }

        // Add new client
        document.getElementById('addClientBtn').addEventListener('click', function() {
            const name = document.getElementById('clientName').value.trim();
            const members = parseInt(document.getElementById('clientMembers').value) || 1;
            const paid = parseFloat(document.getElementById('clientPaid').value) || 0;
            const due = parseFloat(document.getElementById('clientDue').value) || 0;

            if (!name) {
                alert('कृपया क्लाइंट का नाम लिखें');
                return;
            }

            const newClient = {
                id: Date.now(),
                name: name,
                members: members,
                paid: paid,
                due: due
            };

            clients.push(newClient);
            saveClients();

            // Clear form
            document.getElementById('clientName').value = '';
            document.getElementById('clientMembers').value = '1';
            document.getElementById('clientPaid').value = '';
            document.getElementById('clientDue').value = '';
        });

        // Initial render
        renderClients();
        updateTotals();
    })();
</script>

<!-- WhatsApp number change karna mat bhoolna: 9876543210 ko apne number se replace karo -->
</body>
</html>
