<!DOCTYPE html>
<html>
<head>
    <title>अनिल जिम · 3D GYM</title>
    <style>
        body { font-family: sans-serif; background: #0a0f1e; color: white; padding: 15px; }
        .whatsapp-big {
            background: #25D366;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 25px;
            border-radius: 60px;
            text-decoration: none;
            display: block;
            margin: 20px 0;
        }
        .member-card {
            background: #1e2a3a;
            padding: 15px;
            border-radius: 20px;
            margin: 10px 0;
        }
        .admin-panel { display: none; background: gold; padding: 20px; border-radius: 20px; }
        .show { display: block; }
    </style>
</head>
<body>

    <!-- GYM NAME -->
    <h1>🏋️ अनिल जिम</h1>

    <!-- CLIENT KA WHATSAPP NUMBER (BADA BUTTON) -->
    <a href="https://wa.me/919559401761" class="whatsapp-big">
        💬 अनिल सर से बात करें
    </a>

    <!-- MEMBERS LIST (SIRF DEKHNE KE LIYE) -->
    <h3>📋 मेंबर्स लिस्ट</h3>
    <div id="memberList">
        <div class="member-card">राहुल · ₹2000 · पेड</div>
        <div class="member-card">मोहित · ₹1500 · पेंडिंग</div>
    </div>

    <!-- ADMIN PANEL (SIRF CLIENT KO DIKHEGA) -->
    <button onclick="adminToggle()">🔐 एडमिन पैनल</button>
    <div id="admin" class="admin-panel">
        <h4>➕ नया मेंबर जोड़ें</h4>
        <input placeholder="नाम"><br>
        <input placeholder="राशि"><br>
        <button>✅ जोड़ें</button>
    </div>

    <script>
        function adminToggle() {
            document.getElementById('admin').classList.toggle('show');
        }
    </script>
</body>
</html>
