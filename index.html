<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💪 गोल्ड जिम · हर महीने का हिसाब </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f30 100%);
            color: white;
            padding: 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .gym-header {
            background: #141c2c;
            border: 2px solid cyan;
            border-radius: 40px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
        }
        .gym-name {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* MONTH TABS */
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
            justify-content: center;
        }
        .month-btn {
            background: #1f2b44;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #3a5faa;
        }
        .month-btn.active {
            background: cyan;
            color: black;
            border-color: white;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            background: #25D366;
            padding: 25px;
            border-radius: 80px;
            margin: 30px 0;
            text-align: center;
        }
        .whatsapp-btn a {
            color: white;
            text-decoration: none;
            font-size: 32px;
            font-weight: bold;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: #1f2b44;
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            border-left: 6px solid cyan;
        }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: cyan;
        }

        /* Members Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .member-card {
            background: #1a2440;
            border-radius: 30px;
            padding: 20px;
            border: 1px solid #3a5faa;
        }
        .member-name {
            font-size: 28px;
            font-weight: 700;
            color: #aaffff;
        }
        .delete-btn {
            background: #bc3f3f;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Owner Panel */
        .owner-panel {
            background: #2a1f3f;
            border: 3px solid gold;
            border-radius: 40px;
            padding: 30px;
            margin: 40px 0;
        }
        .owner-title { color: gold; font-size: 32px; margin-bottom: 25px; }
        .owner-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .owner-input {
            background: #0f1a2f;
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 18px;
            color: white;
        }
        .owner-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .owner-toggle {
            background: gold;
            color: black;
            padding: 18px;
            border-radius: 60px;
            font-size: 22px;
            width: 100%;
            margin: 20px 0;
            cursor: pointer;
        }
        .footer { text-align: center; color: #5f7a9a; padding: 40px; }
    </style>
</head>
<body>
<div class="container">

    <!-- OWNER TOGGLE -->
    <button class="owner-toggle" onclick="toggleOwnerPanel()">🔐 मालिक पैनल खोलें</button>

    <!-- OWNER PANEL -->
    <div class="owner-panel" id="ownerPanel" style="display: none;">
        <div class="owner-title">⚙️ मालिक पैनल</div>
        
        <!-- Gym Info Update -->
        <h3 style="color: cyan;">🏢 जिम की जानकारी</h3>
        <div class="owner-form">
            <input class="owner-input" id="gymNameInput" placeholder="जिम का नाम">
            <input class="owner-input" id="ownerNameInput" placeholder="मालिक का नाम">
            <button class="owner-btn" onclick="updateGymInfo()">✅ अपडेट करें</button>
        </div>

        <!-- Add Member -->
        <h3 style="color: cyan; margin-top: 30px;">➕ नया सदस्य (इस महीने)</h3>
        <div class="owner-form">
            <input class="owner-input" id="memberName" placeholder="नाम">
            <input class="owner-input" type="number" id="memberAmount" placeholder="राशी">
            <select class="owner-input" id="memberStatus">
                <option value="पेड">✅ पेड</option>
                <option value="बकाया">⏳ बकाया</option>
            </select>
            <button class="owner-btn" onclick="addMember()">➕ जोड़ें</button>
        </div>
    </div>

    <!-- GYM HEADER -->
    <div class="gym-header">
        <div class="gym-name" id="gymNameDisplay">💪 गोल्ड जिम</div>
        <div class="gym-owner" id="ownerNameDisplay" style="font-size: 24px; color: #ffd966;">राजेश कुमार (मालिक)</div>
    </div>

    <!-- WHATSAPP BUTTON (तुम्हारा नंबर) -->
    <div class="whatsapp-btn">
        <a href="https://wa.me/919559401761" target="_blank">
            💬 व्हाट्सएप पर बात करें - 9559401761
        </a>
    </div>

    <!-- MONTH TABS -->
    <div class="month-tabs" id="monthTabs"></div>

    <!-- STATS (हर महीने के) -->
    <div class="stats-grid" id="monthStats"></div>

    <!-- MEMBERS LIST -->
    <h2 style="margin: 30px 0 20px 0;">📋 इस महीने के सदस्य</h2>
    <div class="members-grid" id="membersList"></div>

    <div class="footer">
        3D GYM PRO · हर महीने का अलग हिसाब
    </div>
</div>

<script>
    // ========== DATA ==========
    let gymData = {
        gymName: "गोल्ड जिम",
        ownerName: "राजेश कुमार",
        waNumber: "919559401761",
        months: {
            "जनवरी 2026": [
                { id: 1, name: "सचिन", amount: 2000, status: "पेड" },
                { id: 2, name: "अमित", amount: 2500, status: "बकाया" }
            ],
            "फरवरी 2026": [
                { id: 3, name: "विकास", amount: 3000, status: "पेड" }
            ]
        }
    };

    let currentMonth = "जनवरी 2026";

    // Load from localStorage
    function loadData() {
        let saved = localStorage.getItem('gymProMonths');
        if (saved) {
            gymData = JSON.parse(saved);
        }
    }
    loadData();

    function saveData() {
        localStorage.setItem('gymProMonths', JSON.stringify(gymData));
    }

    // Render everything
    function renderAll() {
        // Gym info
        document.getElementById('gymNameDisplay').innerText = '💪 ' + gymData.gymName;
        document.getElementById('ownerNameDisplay').innerText = gymData.ownerName + ' (मालिक)';
        
        // Month tabs
        let months = Object.keys(gymData.months);
        let tabsHtml = '';
        months.forEach(m => {
            tabsHtml += `<div class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${m}</div>`;
        });
        tabsHtml += `<div class="month-btn" onclick="addNewMonth()">➕ नया महीना</div>`;
        document.getElementById('monthTabs').innerHTML = tabsHtml;
        
        // Current month data
        let members = gymData.months[currentMonth] || [];
        
        // Stats
        let totalMembers = members.length;
        let totalPaid = 0, totalDue = 0;
        members.forEach(m => {
            if (m.status === 'पेड') totalPaid += m.amount;
            else totalDue += m.amount;
        });
        
        document.getElementById('monthStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${totalMembers}</div><div>सदस्य</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalPaid}</div><div>जमा</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalDue}</div><div>बकाया</div></div>
        `;
        
        // Members list with DELETE
        let membersHtml = '';
        members.forEach(m => {
            membersHtml += `
            <div class="member-card">
                <div class="member-name">${m.name}</div>
                <div style="font-size: 20px; margin: 10px 0;">💰 ₹${m.amount}</div>
                <div style="color: ${m.status === 'पेड' ? '#a0ffb0' : '#ffaa66'}; font-size: 20px;">${m.status}</div>
                <button class="delete-btn" onclick="deleteMember(${m.id})" id="delete_${m.id}">🗑️ नाम काटें</button>
            </div>
            `;
        });
        document.getElementById('membersList').innerHTML = membersHtml;
        
        // Hide delete buttons if owner panel closed
        let ownerVisible = document.getElementById('ownerPanel').style.display === 'block';
        document.querySelectorAll('[id^="delete_"]').forEach(btn => {
            btn.style.display = ownerVisible ? 'block' : 'none';
        });
    }

    // Switch month
    window.switchMonth = function(month) {
        currentMonth = month;
        renderAll();
    };

    // Add new month
    window.addNewMonth = function() {
        let newMonth = prompt("नया महीना का नाम लिखो (जैसे: मार्च 2026):");
        if (newMonth && !gymData.months[newMonth]) {
            gymData.months[newMonth] = [];
            saveData();
            currentMonth = newMonth;
            renderAll();
        }
    };

    // Toggle owner panel
    window.toggleOwnerPanel = function() {
        let panel = document.getElementById('ownerPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        renderAll();
    };

    // Update gym info
    window.updateGymInfo = function() {
        gymData.gymName = document.getElementById('gymNameInput').value || gymData.gymName;
        gymData.ownerName = document.getElementById('ownerNameInput').value || gymData.ownerName;
        saveData();
        renderAll();
        alert('✅ अपडेट हो गया');
    };

    // Add member
    window.addMember = function() {
        let name = document.getElementById('memberName').value;
        let amount = parseFloat(document.getElementById('memberAmount').value);
        let status = document.getElementById('memberStatus').value;
        
        if (!name || !amount) {
            alert('नाम और राशी भरो');
            return;
        }
        
        let newId = Date.now();
        gymData.months[currentMonth].push({
            id: newId,
            name: name,
            amount: amount,
            status: status
        });
        
        saveData();
        renderAll();
        
        document.getElementById('memberName').value = '';
        document.getElementById('memberAmount').value = '';
    };

    // Delete member
    window.deleteMember = function(id) {
        if (confirm('हटा दें?')) {
            gymData.months[currentMonth] = gymData.months[currentMonth].filter(m => m.id !== id);
            saveData();
            renderAll();
        }
    };

    // Start
    renderAll();
</script>
</body>
    </html>
