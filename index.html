<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💗 गोल्ड जिम · फाइनल प्रो </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: radial-gradient(circle at 10% 20%, #0f172a, #030614);
            color: white;
            padding: 16px;
        }
        .container { max-width: 1300px; margin: 0 auto; }

        /* Header */
        .gym-header {
            background: linear-gradient(135deg, #0b1a33, #071126);
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .gym-name {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(145deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gym-owner {
            font-size: 28px;
            color: #ffd966;
            margin-top: 8px;
        }

        /* WhatsApp */
        .whatsapp-block {
            background: #25D366;
            border-radius: 100px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .whatsapp-block a {
            color: white;
            text-decoration: none;
            font-size: 32px;
            font-weight: bold;
        }

        /* Month Tabs */
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .month-btn {
            background: #13203b;
            padding: 15px 25px;
            border-radius: 60px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #3b68b0;
        }
        .month-btn.active {
            background: cyan;
            color: black;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #152a44;
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            border-left: 6px solid cyan;
        }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: cyan;
        }

        /* Members Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .member-card {
            background: #10213b;
            border-radius: 40px;
            padding: 25px;
            border: 1px solid #3f78c0;
        }
        .member-name {
            font-size: 28px;
            font-weight: 700;
            color: #b5ffff;
        }

        /* 🔐 OWNER ONLY BUTTONS - यही सबसे जरूरी हिस्सा है */
        .owner-only {
            display: none; /* हर किसी के लिए छुपा हुआ */
        }
        .delete-btn {
            background: #bc3f3f;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .owner-panel {
            background: #1f2937;
            border: 4px solid gold;
            border-radius: 60px;
            padding: 30px;
            display: none;
        }
        .owner-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .owner-input {
            background: #0b1a32;
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 15px;
            color: white;
        }
        .owner-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .owner-toggle {
            background: gold;
            color: black;
            padding: 15px;
            border-radius: 60px;
            font-size: 22px;
            width: 100%;
            margin: 15px 0;
            cursor: pointer;
        }
        .footer { text-align: center; color: #6a8bbf; padding: 30px; }
    </style>
</head>
<body>
<div class="container">

    <!-- OWNER TOGGLE (यह सबको दिखेगा, लेकिन आगे का काम नहीं कर पाएंगे) -->
    <button class="owner-toggle" onclick="toggleOwnerPanel()">🔐 मालिक पैनल</button>

    <!-- OWNER PANEL (यह भी सबको दिखेगा, लेकिन इसमें दिए गए बटन काम नहीं करेंगे) -->
    <div class="owner-panel" id="ownerPanel">
        <h2 style="color: gold;">⚙️ मालिक पैनल</h2>
        
        <h3 style="color:cyan;">🏢 जिम की जानकारी</h3>
        <div class="owner-form">
            <input class="owner-input" id="gymNameInput" placeholder="जिम का नाम">
            <input class="owner-input" id="ownerNameInput" placeholder="मालिक का नाम">
            <button class="owner-btn" onclick="updateGymInfo()">✅ अपडेट</button>
        </div>

        <h3 style="color:cyan;">➕ नया सदस्य (तारीख के साथ)</h3>
        <div class="owner-form">
            <input class="owner-input" id="memberName" placeholder="नाम">
            <input class="owner-input" type="number" id="memberAmount" placeholder="राशी">
            <input class="owner-input" type="date" id="memberDate">
            <select class="owner-input" id="memberStatus">
                <option value="पेड">✅ पेड</option>
                <option value="बकाया">⏳ बकाया</option>
            </select>
            <button class="owner-btn" onclick="addMember()">➕ जोड़ें</button>
        </div>
    </div>

    <!-- GYM HEADER -->
    <div class="gym-header">
        <div class="gym-name" id="gymNameDisplay">💪 गोल्ड जिम</div>
        <div class="gym-owner" id="ownerNameDisplay">राजेश कुमार (मालिक)</div>
    </div>

    <!-- WHATSAPP BUTTON (यह सबको दिखेगा और काम करेगा) -->
    <div class="whatsapp-block">
        <a href="https://wa.me/919559401761" target="_blank">
            💬 व्हाट्सएप - 9559401761
        </a>
    </div>

    <!-- MONTH TABS (यह सबको दिखेगा, लेकिन नया महीना सिर्फ मालिक जोड़ पाएगा) -->
    <div class="month-tabs" id="monthTabs"></div>

    <!-- STATS (सबको दिखेगा) -->
    <div class="stats-grid" id="monthStats"></div>

    <!-- MEMBERS LIST (सबको दिखेगा) -->
    <h2 style="margin: 30px 0;">📋 सदस्य सूची</h2>
    <div class="members-grid" id="membersList"></div>

    <div class="footer">💗 3D GYM PRO · सिर्फ मालिक एडिट करे</div>
</div>

<script>
    // ========== मालिक की पहचान ==========
    // यह एक कोड है जो ब्राउज़र में सेव हो जाता है और बताता है कि यह मालिक का फोन है या नहीं।
    // पहली बार जब कोई फोन वेबसाइट खोलेगा, वह मालिक बन जाएगा। उसके बाद वही फोन हमेशा मालिक रहेगा।
    let OWNER_KEY = "gymProOwner_" + "गोल्ड जिम"; // हर जिम के लिए अलग
    let isThisDeviceOwner = localStorage.getItem(OWNER_KEY) === 'true';
    
    // अगर यह पहली बार है और कोई मालिक नहीं है, तो इस फोन को मालिक बना दो
    if (!localStorage.getItem(OWNER_KEY)) {
        // पहला फोन ही मालिक बनेगा
        localStorage.setItem(OWNER_KEY, 'true');
        isThisDeviceOwner = true;
    }

    // ========== डेटा ==========
    let gymData = {
        gymName: "गोल्ड जिम",
        ownerName: "राजेश कुमार",
        waNumber: "919559401761",
        months: {
            "जनवरी 2026": [
                { id: 1, name: "सचिन", amount: 2000, status: "पेड", date: "2026-01-15" },
                { id: 2, name: "अमित", amount: 2500, status: "बकाया", date: "2026-01-10" }
            ],
            "फरवरी 2026": [
                { id: 3, name: "विकास", amount: 3000, status: "पेड", date: "2026-02-05" }
            ]
        }
    };

    let currentMonth = "जनवरी 2026";
    let isOwnerPanelOpen = false;

    // लोकल स्टोरेज से लोड (सबके लिए एक ही डेटा)
    function loadData() {
        let saved = localStorage.getItem('gymProMasterData');
        if (saved) {
            gymData = JSON.parse(saved);
        } else {
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('gymProMasterData', JSON.stringify(gymData));
    }

    loadData();

    // ========== रेंडर ==========
    function renderAll() {
        document.getElementById('gymNameDisplay').innerText = '💪 ' + gymData.gymName;
        document.getElementById('ownerNameDisplay').innerText = gymData.ownerName + ' (मालिक)';

        // Month tabs - नया महीना वाला बटन सिर्फ मालिक को दिखे
        let months = Object.keys(gymData.months);
        let tabsHtml = '';
        months.forEach(m => {
            tabsHtml += `<div class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${m}</div>`;
        });
        // यहाँ चेक: अगर यह मालिक का फोन है तभी "नया महीना" बटन दिखाओ
        if (isThisDeviceOwner) {
            tabsHtml += `<div class="month-btn" onclick="addNewMonth()">➕ नया महीना</div>`;
        }
        document.getElementById('monthTabs').innerHTML = tabsHtml;

        let members = gymData.months[currentMonth] || [];

        // Stats
        let totalPaid = 0, totalDue = 0;
        members.forEach(m => {
            if (m.status === 'पेड') totalPaid += m.amount;
            else totalDue += m.amount;
        });
        document.getElementById('monthStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${members.length}</div><div>सदस्य</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalPaid}</div><div>जमा</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalDue}</div><div>बकाया</div></div>
        `;

        // Members list - DELETE बटन सिर्फ मालिक को दिखे और वह भी तब जब पैनल खुला हो
        let membersHtml = '';
        members.forEach(m => {
            let dateStr = m.date ? m.date.split('-').reverse().join('-') : 'कोई तारीख नहीं';
            membersHtml += `
            <div class="member-card">
                <div class="member-name">${m.name}</div>
                <div style="font-size:20px; margin:10px 0;">💰 ₹${m.amount}</div>
                <div style="color: ${m.status === 'पेड' ? '#a0ffb0' : '#ffaa66'}; font-size:20px;">${m.status}</div>
                <div style="color:#aaccff; margin:10px 0;">📅 ${dateStr}</div>
            `;
            // DELETE बटन: सिर्फ मालिक के लिए और तभी जब पैनल खुला हो
            if (isThisDeviceOwner && isOwnerPanelOpen) {
                membersHtml += `<button class="delete-btn" onclick="deleteMember(${m.id})">🗑️ नाम काटें</button>`;
            }
            membersHtml += `</div>`;
        });
        document.getElementById('membersList').innerHTML = membersHtml;

        // Owner panel के बटनों को भी कंट्रोल करो - सिर्फ मालिक के लिए
        if (isThisDeviceOwner) {
            // मालिक के लिए पैनल के बटन सामान्य रहेंगे
        } else {
            // जो यूजर है, उसके लिए पैनल के सारे बटन हटा दो या डिसेबल कर दो
            // हम उन्हें छुपा देंगे
            document.querySelectorAll('#ownerPanel button').forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.5';
            });
        }
    }

    // ========== FUNCTIONS (सबसे ऊपर सुरक्षा) ==========
    window.switchMonth = function(month) {
        currentMonth = month;
        renderAll();
    };

    window.addNewMonth = function() {
        if (!isThisDeviceOwner) return; // सिर्फ मालिक
        let newMonth = prompt("नया महीना का नाम लिखो (जैसे: मार्च 2026):");
        if (newMonth && !gymData.months[newMonth]) {
            gymData.months[newMonth] = [];
            saveData();
            currentMonth = newMonth;
            renderAll();
        }
    };

    window.toggleOwnerPanel = function() {
        // पैनल को खोलना/बंद करना सबके लिए है, लेकिन अंदर के बटन सिर्फ मालिक के लिए काम करेंगे
        let panel = document.getElementById('ownerPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            isOwnerPanelOpen = false;
        } else {
            panel.style.display = 'block';
            isOwnerPanelOpen = true;
        }
        renderAll(); // DELETE बटन दिखाने/छुपाने के लिए
    };

    window.updateGymInfo = function() {
        if (!isThisDeviceOwner) return; // सिर्फ मालिक
        gymData.gymName = document.getElementById('gymNameInput').value || gymData.gymName;
        gymData.ownerName = document.getElementById('ownerNameInput').value || gymData.ownerName;
        saveData();
        renderAll();
        alert('✅ जिम की जानकारी अपडेट हो गई');
    };

    window.addMember = function() {
        if (!isThisDeviceOwner) return; // सिर्फ मालिक
        let name = document.getElementById('memberName').value;
        let amount = parseFloat(document.getElementById('memberAmount').value);
        let date = document.getElementById('memberDate').value;
        let status = document.getElementById('memberStatus').value;

        if (!name || !amount || !date) {
            alert('❌ नाम, राशी और तारीख भरो');
            return;
        }

        if (!gymData.months[currentMonth]) {
            gymData.months[currentMonth] = [];
        }
        gymData.months[currentMonth].push({
            id: Date.now(),
            name: name,
            amount: amount,
            status: status,
            date: date
        });

        saveData();
        renderAll();
        
        document.getElementById('memberName').value = '';
        document.getElementById('memberAmount').value = '';
    };

    window.deleteMember = function(id) {
        if (!isThisDeviceOwner) return; // सिर्फ मालिक
        if (confirm('क्या सच में इस सदस्य को हटा दें?')) {
            gymData.months[currentMonth] = gymData.months[currentMonth].filter(m => m.id !== id);
            saveData();
            renderAll();
        }
    };

    // शुरू करो
    renderAll();
</script>
</body>
    </html>
