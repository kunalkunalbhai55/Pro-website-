<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💪 गोल्ड जिम · फाइनल </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: radial-gradient(circle at 10% 20%, #0f172a, #030614);
            color: white;
            padding: 16px;
        }
        .container { max-width: 1300px; margin: 0 auto; }

        /* Header */
        .gym-header {
            background: linear-gradient(135deg, #0b1a33, #071126);
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .gym-name {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(145deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gym-owner {
            font-size: 28px;
            color: #ffd966;
            margin-top: 8px;
        }

        /* WhatsApp Button (aapka number) */
        .whatsapp-block {
            background: #25D366;
            border-radius: 100px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .whatsapp-block a {
            color: white;
            text-decoration: none;
            font-size: 32px;
            font-weight: bold;
        }

        /* Admin Button - sabko dikhega */
        .admin-toggle {
            background: gold;
            color: black;
            padding: 18px;
            border-radius: 60px;
            font-size: 26px;
            font-weight: bold;
            width: 100%;
            border: none;
            margin: 15px 0;
            cursor: pointer;
        }

        /* Password Box - yahi se admin panel khulega */
        .password-box {
            background: #1f2937;
            border: 3px solid gold;
            border-radius: 60px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }
        .password-input {
            background: #0b1a32;
            border: 2px solid cyan;
            border-radius: 60px;
            padding: 18px;
            font-size: 22px;
            color: white;
            width: 300px;
            max-width: 90%;
            margin: 15px;
        }
        .password-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 60px;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Admin Panel - password ke baad khulega */
        .admin-panel {
            background: #1f2937;
            border: 4px solid gold;
            border-radius: 60px;
            padding: 30px;
            margin: 20px 0;
            display: none;
        }
        .admin-title {
            color: gold;
            font-size: 32px;
            margin-bottom: 25px;
        }
        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .admin-input {
            background: #0b1a32;
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 15px;
            color: white;
        }
        .admin-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn {
            background: #bc3f3f;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* पहले से छुपा */
        }

        /* Month Tabs */
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .month-btn {
            background: #13203b;
            padding: 15px 25px;
            border-radius: 60px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #3b68b0;
        }
        .month-btn.active {
            background: cyan;
            color: black;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #152a44;
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            border-left: 6px solid cyan;
        }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: cyan;
        }

        /* Members Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .member-card {
            background: #10213b;
            border-radius: 40px;
            padding: 25px;
            border: 1px solid #3f78c0;
        }
        .member-name {
            font-size: 28px;
            font-weight: 700;
            color: #b5ffff;
        }

        .footer { text-align: center; color: #6a8bbf; padding: 30px; }
    </style>
</head>
<body>
<div class="container">

    <!-- GYM HEADER -->
    <div class="gym-header">
        <div class="gym-name" id="gymNameDisplay">💪 गोल्ड जिम</div>
        <div class="gym-owner" id="ownerNameDisplay">राजेश कुमार (मालिक)</div>
    </div>

    <!-- WHATSAPP BUTTON (तुम्हारा नंबर) -->
    <div class="whatsapp-block">
        <a href="https://wa.me/919559401761" target="_blank">
            💬 व्हाट्सएप - 9559401761
        </a>
    </div>

    <!-- 🔐 एडमिन बटन - यह सबको दिखेगा -->
    <button class="admin-toggle" onclick="showPasswordBox()">🔐 एडमिन पैनल खोलें</button>

    <!-- 🔑 पासवर्ड बॉक्स - यहीं से एडमिन पैनल खुलेगा -->
    <div class="password-box" id="passwordBox">
        <h2 style="color: gold;">⚙️ एडमिन पैनल के लिए पासवर्ड डालें</h2>
        <input type="password" class="password-input" id="adminPassword" placeholder="पासवर्ड">
        <button class="password-btn" onclick="checkPassword()">✅ एडमिन पैनल खोलें</button>
        <p style="color: #aaccff; margin-top: 15px;">💡 सिर्फ जिम मालिक को पता होगा</p>
    </div>

    <!-- 👑 एडमिन पैनल - सिर्फ पासवर्ड के बाद दिखेगा -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">⚙️ एडमिन पैनल (सिर्फ मालिक के लिए)</div>
        
        <h3 style="color:cyan;">🏢 जिम की जानकारी</h3>
        <div class="admin-form">
            <input class="admin-input" id="gymNameInput" placeholder="जिम का नाम">
            <input class="admin-input" id="ownerNameInput" placeholder="मालिक का नाम">
            <button class="admin-btn" onclick="updateGymInfo()">✅ अपडेट</button>
        </div>

        <h3 style="color:cyan;">➕ नया सदस्य (तारीख के साथ)</h3>
        <div class="admin-form">
            <input class="admin-input" id="memberName" placeholder="नाम">
            <input class="admin-input" type="number" id="memberAmount" placeholder="राशी (₹)">
            <input class="admin-input" type="date" id="memberDate" value="2026-02-15">
            <select class="admin-input" id="memberStatus">
                <option value="पेड">✅ पेड</option>
                <option value="बकाया">⏳ बकाया</option>
            </select>
            <button class="admin-btn" onclick="addMember()">➕ जोड़ें</button>
        </div>
    </div>

    <!-- MONTH TABS (सबको दिखेगा) -->
    <div class="month-tabs" id="monthTabs"></div>

    <!-- STATS (सबको दिखेगा) -->
    <div class="stats-grid" id="monthStats"></div>

    <!-- MEMBERS LIST (सबको दिखेगा) -->
    <h2 style="margin: 30px 0;">📋 सदस्य सूची</h2>
    <div class="members-grid" id="membersList"></div>

    <div class="footer">💗 3D GYM PRO · सिर्फ पासवर्ड से एडिट</div>
</div>

<script>
    // ========== पासवर्ड सेट करो ==========
    const ADMIN_PASSWORD = "gym@2026";  // ⚠️ यहाँ अपना पासवर्ड लिखो
    
    // ========== गोल्ड जिम का डेटा ==========
    let gymData = {
        gymName: "गोल्ड जिम",
        ownerName: "राजेश कुमार",
        waNumber: "919559401761",
        months: {
            "जनवरी 2026": [
                { id: 1, name: "सचिन", amount: 2000, status: "पेड", date: "2026-01-15" },
                { id: 2, name: "अमित", amount: 2500, status: "बकाया", date: "2026-01-10" }
            ],
            "फरवरी 2026": [
                { id: 3, name: "विकास", amount: 3000, status: "पेड", date: "2026-02-05" }
            ]
        }
    };

    let currentMonth = "जनवरी 2026";
    let isAdminActive = false;  // क्या एडमिन मोड ऑन है?

    // लोकल स्टोरेज से डेटा लोड करो
    function loadData() {
        let saved = localStorage.getItem('gymMasterData');
        if (saved) {
            gymData = JSON.parse(saved);
        }
    }
    loadData();

    function saveData() {
        localStorage.setItem('gymMasterData', JSON.stringify(gymData));
    }

    // पासवर्ड बॉक्स दिखाओ
    window.showPasswordBox = function() {
        document.getElementById('passwordBox').style.display = 'block';
    };

    // पासवर्ड चेक करो
    window.checkPassword = function() {
        let entered = document.getElementById('adminPassword').value;
        if (entered === ADMIN_PASSWORD) {
            isAdminActive = true;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('passwordBox').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            
            // सारे DELETE बटन दिखाओ
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.style.display = 'block';
            });
            
            renderAll();
            alert('✅ एडमिन पैनल खुल गया');
        } else {
            alert('❌ गलत पासवर्ड');
        }
    };

    // सब कुछ रेंडर करो
    function renderAll() {
        // Gym info
        document.getElementById('gymNameDisplay').innerText = '💪 ' + gymData.gymName;
        document.getElementById('ownerNameDisplay').innerText = gymData.ownerName + ' (मालिक)';

        // Month tabs
        let months = Object.keys(gymData.months);
        let tabsHtml = '';
        months.forEach(m => {
            tabsHtml += `<div class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${m}</div>`;
        });
        document.getElementById('monthTabs').innerHTML = tabsHtml;

        let members = gymData.months[currentMonth] || [];

        // Stats
        let totalPaid = 0, totalDue = 0;
        members.forEach(m => {
            if (m.status === 'पेड') totalPaid += m.amount;
            else totalDue += m.amount;
        });
        document.getElementById('monthStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${members.length}</div><div>सदस्य</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalPaid}</div><div>जमा</div></div>
            <div class="stat-card"><div class="stat-number">₹${totalDue}</div><div>बकाया</div></div>
        `;

        // Members list
        let membersHtml = '';
        members.forEach(m => {
            let dateStr = m.date ? m.date.split('-').reverse().join('-') : 'कोई तारीख नहीं';
            membersHtml += `
            <div class="member-card">
                <div class="member-name">${m.name}</div>
                <div style="font-size:20px; margin:10px 0;">💰 ₹${m.amount}</div>
                <div style="color: ${m.status === 'पेड' ? '#a0ffb0' : '#ffaa66'}; font-size:20px;">${m.status}</div>
                <div style="color:#aaccff; margin:10px 0;">📅 ${dateStr}</div>
                <button class="delete-btn" onclick="deleteMember(${m.id})" style="display: ${isAdminActive ? 'block' : 'none'};">🗑️ नाम काटें</button>
            </div>
            `;
        });
        document.getElementById('membersList').innerHTML = membersHtml;

        // Admin panel में values डालो
        if (isAdminActive) {
            document.getElementById('gymNameInput').value = gymData.gymName;
            document.getElementById('ownerNameInput').value = gymData.ownerName;
        }
    }

    // महीना बदलो
    window.switchMonth = function(month) {
        currentMonth = month;
        renderAll();
    };

    // जिम जानकारी अपडेट करो
    window.updateGymInfo = function() {
        if (!isAdminActive) return;
        gymData.gymName = document.getElementById('gymNameInput').value || gymData.gymName;
        gymData.ownerName = document.getElementById('ownerNameInput').value || gymData.ownerName;
        saveData();
        renderAll();
        alert('✅ जिम की जानकारी अपडेट हो गई');
    };

    // नया सदस्य जोड़ो
    window.addMember = function() {
        if (!isAdminActive) return;
        let name = document.getElementById('memberName').value;
        let amount = parseFloat(document.getElementById('memberAmount').value);
        let date = document.getElementById('memberDate').value;
        let status = document.getElementById('memberStatus').value;

        if (!name || !amount || !date) {
            alert('❌ नाम, राशी और तारीख भरो');
            return;
        }

        if (!gymData.months[currentMonth]) {
            gymData.months[currentMonth] = [];
        }
        gymData.months[currentMonth].push({
            id: Date.now(),
            name: name,
            amount: amount,
            status: status,
            date: date
        });

        saveData();
        renderAll();
        
        document.getElementById('memberName').value = '';
        document.getElementById('memberAmount').value = '';
    };

    // सदस्य हटाओ
    window.deleteMember = function(id) {
        if (!isAdminActive) return;
        if (confirm('क्या सच में इस सदस्य को हटा दें?')) {
            gymData.months[currentMonth] = gymData.months[currentMonth].filter(m => m.id !== id);
            saveData();
            renderAll();
        }
    };

    // शुरू करो
    renderAll();
</script>
</body>
    </html>
