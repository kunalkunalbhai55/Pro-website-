<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💪 गोल्ड जिम · 3D प्रो </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f30 100%);
            color: white;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* ========== 3D HEADER ========== */
        .gym-header {
            background: #141c2cee;
            backdrop-filter: blur(10px);
            border: 2px solid #00ffff55;
            border-radius: 40px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: 0 20px 30px -10px #00aaff33;
            text-align: center;
        }
        .gym-name {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #aaffff, #6ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 10px;
        }
        .gym-owner {
            font-size: 24px;
            color: #ffd966;
            margin-bottom: 15px;
        }
        .gym-address {
            font-size: 18px;
            color: #aaccff;
            background: #1f2b44;
            display: inline-block;
            padding: 12px 30px;
            border-radius: 60px;
        }

        /* ========== SUPER WHatsApp BUTTON ========== */
        .super-wa {
            background: #25D366;
            padding: 25px 20px;
            border-radius: 80px;
            margin: 30px 0;
            text-align: center;
            border-bottom: 6px solid #128C7E;
            box-shadow: 0 15px 30px #25D36666;
        }
        .super-wa a {
            color: white;
            text-decoration: none;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .super-wa span {
            background: white;
            color: #25D366;
            padding: 8px 25px;
            border-radius: 60px;
            font-size: 28px;
        }

        /* ========== STATS CARDS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: #1f2b44;
            border-radius: 30px;
            padding: 25px 15px;
            text-align: center;
            border-left: 6px solid cyan;
        }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: cyan;
        }
        .stat-label {
            font-size: 18px;
            color: #b5d0ff;
        }

        /* ========== MEMBERS SECTION ========== */
        .section-title {
            font-size: 32px;
            margin: 40px 0 20px 0;
            border-left: 8px solid cyan;
            padding-left: 20px;
        }
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .member-card {
            background: #1a2440;
            border-radius: 30px;
            padding: 25px;
            border: 1px solid #3a5faa;
            transition: 0.2s;
        }
        .member-card:hover { border-color: cyan; box-shadow: 0 0 25px cyan; }
        .member-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #aaffff;
        }
        .member-row {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            padding: 12px 0;
            border-bottom: 1px dashed #3f5a8a;
        }
        .badge-paid { color: #a0ffb0; font-weight: 700; }
        .badge-due { color: #ffaa66; font-weight: 700; }

        /* ========== OWNER PANEL (सिर्फ मालिक देखेगा) ========== */
        .owner-panel {
            background: #2a1f3f;
            border: 3px solid gold;
            border-radius: 40px;
            padding: 30px;
            margin: 40px 0;
        }
        .owner-title {
            color: gold;
            font-size: 32px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .owner-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .owner-input {
            background: #0f1a2f;
            border: 2px solid cyan;
            border-radius: 50px;
            padding: 18px;
            color: white;
            font-size: 18px;
        }
        .owner-btn {
            background: gold;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn {
            background: #bc3f3f;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 25px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }
        .owner-toggle {
            background: gold;
            color: black;
            padding: 18px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: bold;
            width: 100%;
            border: none;
            margin: 20px 0;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            color: #5f7a9a;
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 👑 OWNER TOGGLE BUTTON (सिर्फ मालिक जानता है) -->
    <button class="owner-toggle" onclick="toggleOwnerPanel()">🔐 मालिक पैनल खोलें (सिर्फ आपके लिए)</button>

    <!-- 🔒 OWNER PANEL (शुरू में छुपा) -->
    <div class="owner-panel" id="ownerPanel" style="display: none;">
        <div class="owner-title">⚙️ जिम का मालिक पैनल</div>
        
        <!-- Gym details edit -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: cyan; margin-bottom: 15px;">🏢 जिम की जानकारी</h3>
            <div class="owner-form">
                <input class="owner-input" id="gymNameInput" placeholder="जिम का नाम">
                <input class="owner-input" id="ownerNameInput" placeholder="मालिक का नाम">
                <input class="owner-input" id="waNumberInput" placeholder="WhatsApp नंबर (10 अंक)">
                <input class="owner-input" id="addressInput" placeholder="पता">
                <button class="owner-btn" onclick="updateGymInfo()">✅ अपडेट करें</button>
            </div>
        </div>

        <!-- Add member -->
        <h3 style="color: cyan; margin-bottom: 15px;">➕ नया सदस्य जोड़ें</h3>
        <div class="owner-form">
            <input class="owner-input" id="memberName" placeholder="नाम">
            <input class="owner-input" type="number" id="memberAmount" placeholder="राशी (₹)">
            <select class="owner-input" id="memberStatus">
                <option value="पेड">✅ पेड</option>
                <option value="बकाया">⏳ बकाया</option>
            </select>
            <button class="owner-btn" onclick="addMember()">➕ जोड़ें</button>
        </div>
    </div>

    <!-- ========== GYM HEADER (लाइव अपडेट) ========== -->
    <div class="gym-header" id="gymHeader">
        <div class="gym-name" id="gymNameDisplay">💪 गोल्ड जिम</div>
        <div class="gym-owner" id="ownerNameDisplay">राजेश कुमार (मालिक)</div>
        <div class="gym-address" id="addressDisplay">सेक्टर 17, फरीदाबाद</div>
    </div>

    <!-- ========== SUPER WHatsApp BUTTON (लाइव) ========== -->
    <div class="super-wa" id="waButton">
        <a href="https://wa.me/919559401761" target="_blank" id="waLink">
            💬 <span>व्हाट्सएप</span> पर बात करें - राजेश सर
        </a>
    </div>

    <!-- ========== STATS (लाइव) ========== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalMembers">0</div>
            <div class="stat-label">कुल सदस्य</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalPaid">₹0</div>
            <div class="stat-label">कुल जमा</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalDue">₹0</div>
            <div class="stat-label">कुल बकाया</div>
        </div>
    </div>

    <!-- ========== MEMBERS LIST (सबको दिखे, बदल न सके) ========== -->
    <div class="section-title">🏋️ हमारे मेंबर</div>
    <div class="members-grid" id="membersList"></div>

    <!-- ========== FOOTER ========== -->
    <div class="footer">
        3D GYM PRO · हर जिम की शान · 24/7 सपोर्ट
    </div>
</div>

<script>
    // ========== DATA (लोकल स्टोरेज) ==========
    let gymData = {
        gymName: "गोल्ड जिम",
        ownerName: "राजेश कुमार",
        waNumber: "919876543210",
        address: "सेक्टर 17, फरीदाबाद",
        members: [
            { id: 1, name: "सचिन", amount: 2000, status: "पेड" },
            { id: 2, name: "अमित", amount: 2500, status: "बकाया" },
            { id: 3, name: "विकास", amount: 3000, status: "पेड" }
        ]
    };

    // लोकल स्टोरेज से लोड करो
    function loadData() {
        let saved = localStorage.getItem('gymProData');
        if (saved) {
            gymData = JSON.parse(saved);
        }
    }
    loadData();

    // सेव करो
    function saveData() {
        localStorage.setItem('gymProData', JSON.stringify(gymData));
    }

    // ========== सब कुछ दिखाओ ==========
    function renderAll() {
        // Gym info
        document.getElementById('gymNameDisplay').innerText = '💪 ' + gymData.gymName;
        document.getElementById('ownerNameDisplay').innerText = gymData.ownerName + ' (मालिक)';
        document.getElementById('addressDisplay').innerText = gymData.address;
        
        // WhatsApp button
        let waLink = document.getElementById('waLink');
        waLink.href = 'https://wa.me/' + gymData.waNumber;
        waLink.innerHTML = '💬 <span>व्हाट्सएप</span> पर बात करें - ' + gymData.ownerName.split(' ')[0] + ' सर';
        
        // Stats
        let totalMembers = gymData.members.length;
        let totalPaid = 0, totalDue = 0;
        gymData.members.forEach(m => {
            if (m.status === 'पेड') totalPaid += m.amount;
            else totalDue += m.amount;
        });
        document.getElementById('totalMembers').innerText = totalMembers;
        document.getElementById('totalPaid').innerText = '₹' + totalPaid;
        document.getElementById('totalDue').innerText = '₹' + totalDue;
        
        // Members list
        let html = '';
        gymData.members.forEach(m => {
            html += `
            <div class="member-card">
                <div class="member-name">${m.name}</div>
                <div class="member-row"><span>💰 राशी</span> <strong>₹${m.amount}</strong></div>
                <div class="member-row"><span>📌 स्थिति</span> 
                    <strong class="${m.status === 'पेड' ? 'badge-paid' : 'badge-due'}">${m.status}</strong>
                </div>
            </div>
            `;
        });
        document.getElementById('membersList').innerHTML = html;
        
        // Owner form में current values डालो
        document.getElementById('gymNameInput').value = gymData.gymName;
        document.getElementById('ownerNameInput').value = gymData.ownerName;
        document.getElementById('waNumberInput').value = gymData.waNumber;
        document.getElementById('addressInput').value = gymData.address;
    }

    // ========== OWNER PANEL TOGGLE ==========
    function toggleOwnerPanel() {
        let panel = document.getElementById('ownerPanel');
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'block';
        } else {
            panel.style.display = 'none';
        }
    }

    // ========== GYM INFO UPDATE ==========
    function updateGymInfo() {
        gymData.gymName = document.getElementById('gymNameInput').value || gymData.gymName;
        gymData.ownerName = document.getElementById('ownerNameInput').value || gymData.ownerName;
        gymData.waNumber = document.getElementById('waNumberInput').value || gymData.waNumber;
        gymData.address = document.getElementById('addressInput').value || gymData.address;
        
        saveData();
        renderAll();
        alert('✅ जिम की जानकारी अपडेट हो गई');
    }

    // ========== ADD MEMBER ==========
    function addMember() {
        let name = document.getElementById('memberName').value;
        let amount = parseFloat(document.getElementById('memberAmount').value);
        let status = document.getElementById('memberStatus').value;
        
        if (!name || !amount) {
            alert('नाम और राशी दोनों भरो');
            return;
        }
        
        let newId = Date.now();
        gymData.members.push({
            id: newId,
            name: name,
            amount: amount,
            status: status
        });
        
        saveData();
        renderAll();
        
        // Form clear
        document.getElementById('memberName').value = '';
        document.getElementById('memberAmount').value = '';
        
        alert('✅ सदस्य जुड़ गया');
    }

    // ========== शुरू करो ==========
    renderAll();
</script>
</body>
        </html>
